<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Bug Tower Defense</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="game-container">
    <canvas id="game" width="960" height="640"></canvas>

    <div id="panel">
      <h2>Shop <span id="money"></span></h2>
      <div id="shop-list"></div>

      <h2>Selected Tower</h2>
      <div id="stats"></div>
      <div id="upgrade-paths" class="upgrade-paths"></div>

      <h2>Wave</h2>
      <div id="wave-info"></div>
      <button id="next-round-btn" type="button">Next Round</button>
      <button id="speed-toggle-btn" type="button">1x Speed</button>
      <div id="boost-info"></div>
      <div id="seed-info"></div>
    </div>
  </div>

  <script src="js/random.js"></script>
  <script src="js/towers.js"></script>
  <script src="js/map.js"></script>
  <script src="js/wildlife.js"></script>
  <script src="js/enemies.js"></script>
  <script src="js/game.js"></script>
</body>
</html>
