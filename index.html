<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bug Tower Defense</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="game-container">
    <canvas id="game" width="960" height="640"></canvas>

    <div id="panel">
      <h2>Sunflower</h2>
      <div id="stats"></div>

      <div class="path" id="path-0">
        <h3>Solar Path</h3>
        <button data-path="0" type="button"></button>
      </div>
      <div class="path" id="path-1">
        <h3>Path 2</h3>
        <button data-path="1" type="button" disabled>Not yet designed</button>
      </div>
      <div class="path" id="path-2">
        <h3>Path 3</h3>
        <button data-path="2" type="button" disabled>Not yet designed</button>
      </div>

      <h2>Wave</h2>
      <div id="wave-info"></div>
      <button id="next-round-btn" type="button">Next Round</button>
    </div>
  </div>

  <script src="js/towers.js"></script>
  <script src="js/map.js"></script>
  <script src="js/enemies.js"></script>
  <script src="js/game.js"></script>
</body>
</html>
